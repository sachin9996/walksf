<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="__EXPL_PCT__% of San Francisco streets walked">
  <meta name="theme-color" content="#0b1e2d">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://walksf.quest">
  <meta property="og:title" content="__EXPL_PCT__% of SF explored">
  <meta property="og:description" content="A map of streets I've walked in San Francisco.">
  <meta property="og:image" content="https://walksf.quest/static/images/preview.a846793b9142.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="__EXPL_PCT__% of SF explored">
  <meta name="twitter:description" content="A map of streets I've walked in San Francisco.">
  <meta name="twitter:image" content="https://walksf.quest/static/images/preview.a846793b9142.png">
  <title>Walk SF</title>
  <link rel="icon" href="/static/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/index.e4bd6eadc26b.css">
  <noscript>
    <link rel="stylesheet" href="/static/noscript.020371e2a155.css">
  </noscript>
</head>

<body>
  <noscript>
    <img class="noscript-map" src="/noscript-map.svg" alt="Map of San Francisco streets walked">
  </noscript>
  <div id="mapWrap">
    <canvas id="map" tabindex="0" aria-label="Map of San Francisco streets"></canvas>
    <div id="photoPinsLayer" aria-hidden="true"></div>
    <div id="loading" class="loading" role="status" aria-busy="true" aria-live="polite" aria-label="Loading map">
      <div class="loading-inner">
        <div class="loading-spinner" aria-hidden="true"></div>
        <p class="loading-text">Loading</p>
      </div>
    </div>
  </div>
  <div id="help" class="help-wrap">
    <button type="button" id="helpBtn" aria-label="Show help" aria-expanded="false">?</button>
    <div id="helpTooltip" role="tooltip" aria-hidden="true">
      <p><strong>What?</strong> My progress walking around SF.</p>
      <p><strong>Why?</strong> I like walking around!</p>
      <p><strong>How?</strong> Smartwatch data + some code.</p>
    </div>
  </div>
  <div class="map-controls">
    <div id="compass" aria-hidden="true" title="Drag to rotate map (North)" role="img" aria-label="North">
      <img src="/static/images/compass.svg" alt="" class="compass-icon" aria-hidden="true">
    </div>
    <div id="zoom" role="group" aria-label="Zoom controls">
      <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
      <button type="button" id="zoomOut" aria-label="Zoom out">−</button>
      <button type="button" id="zoomReset" aria-label="Reset zoom">⌂</button>
    </div>
  </div>
  <div id="footerStats">
    <div class="footer-top">
      <div id="timeline" class="timeline" hidden>
        <span id="timelineLabel" class="timeline-label" aria-hidden="true"></span>
        <input type="range" id="timelineSlider" min="0" max="0" step="1" value="0"
          aria-label="Show exploration through month">
      </div>
      <a href="https://github.com/sachin9996/walksf" target="_blank" rel="noopener" class="footer-github"
        aria-label="View on GitHub">
        <img src="/static/images/github.svg" alt="" class="footer-github-icon" aria-hidden="true">
      </a>
    </div>
    <div class="completion-line">
      <span id="completion" aria-live="polite">__EXPL_PCT_PADDED__% complete</span>
      <span class="completion-km">(__EXPL_KM__/__TOTAL_KM__ km)</span>
    </div>
    <div id="updated">__LAST_UPDATED_TIMESTAMP__</div>
  </div>
  <noscript>
    <div class="noscript-footer">
      <div class="noscript-track" aria-hidden="true">
        <div class="noscript-walker">
          <div class="noscript-step noscript-step-l noscript-trail-0">
            <span class="noscript-print"></span>
          </div>
          <div class="noscript-step noscript-step-r noscript-trail-1">
            <span class="noscript-print"></span>
          </div>
          <div class="noscript-step noscript-step-l noscript-trail-2">
            <span class="noscript-print"></span>
          </div>
          <div class="noscript-step noscript-step-r noscript-trail-3">
            <span class="noscript-print"></span>
          </div>
        </div>
      </div>
      <p class="noscript-note"><span class="noscript-js">JavaScript</span> required for interactivity.</p>
    </div>
  </noscript>
  <div id="ruler" class="ruler-hidden" aria-hidden="true">
    <div id="rulerLat" class="ruler-axis ruler-lat">
      <div class="ruler-line"></div>
      <div id="rulerLatLabels" class="ruler-labels"></div>
    </div>
    <div id="rulerLon" class="ruler-axis ruler-lon">
      <div class="ruler-line"></div>
      <div id="rulerLonLabels" class="ruler-labels"></div>
    </div>
  </div>
  <div id="scaleCompass" class="scale-compass-wrap">
    <div id="scale" class="scale-dimmed" aria-hidden="true">
      <span id="scaleBar"></span>
      <span id="scaleLabel"></span>
    </div>
  </div>
  <div id="nbdTooltip" role="tooltip" aria-hidden="true"></div>
  <div id="photoModal" role="dialog" aria-modal="true" aria-label="Photo" aria-hidden="true">
    <div class="photo-modal-card">
      <div class="photo-modal-image-wrap" id="photoModalImageWrap">
        <div class="photo-modal-skeleton" aria-hidden="true"></div>
        <img id="photoModalImg" alt="" />
      </div>
      <span class="photo-modal-date"></span>
      <span class="photo-modal-coords"></span>
    </div>
  </div>
  <script src="/static/index.30db4dc9ab6c.js" defer></script>
</body>

</html>
